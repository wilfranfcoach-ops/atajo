<script>
(function(){
function show(id){
 console.log('ATAJO show', id);
 var u=document.getElementById('wrap-usuario');
 var ad=document.getElementById('wrap-admin');
 var al=document.getElementById('wrap-almacen');
 var bu=document.getElementById('btn-usuario');
 var ba=document.getElementById('btn-admin');
 var bm=document.getElementById('btn-almacen');
 if(u) u.classList.add('hidden');
 if(ad) ad.classList.add('hidden');
 if(al) al.classList.add('hidden');
 if(bu){bu.style.backgroundColor='#FFFFFF'; bu.style.color='#111827';}
 if(ba){ba.style.backgroundColor='#FFFFFF'; ba.style.color='#111827';}
 if(bm){bm.style.backgroundColor='#FFFFFF'; bm.style.color='#111827';}
 if(id==='usuario'){ if(u) u.classList.remove('hidden'); if(bu){bu.style.backgroundColor='#111827'; bu.style.color='#FFFFFF';}}
 if(id==='admin'){ if(ad) ad.classList.remove('hidden'); if(ba){ba.style.backgroundColor='#111827'; ba.style.color='#FFFFFF';}}
 if(id==='almacen'){ if(al) al.classList.remove('hidden'); if(bm){bm.style.backgroundColor='#111827'; bm.style.color='#FFFFFF';}}
}
function attach(){
 var bu=document.getElementById('btn-usuario');
 var ba=document.getElementById('btn-admin');
 var bm=document.getElementById('btn-almacen');
 if(!bu || !ba || !bm){ setTimeout(attach, 300); return; }
 console.log('ATAJO buttons found, attaching');
 bu.addEventListener('click', function(e){ e.preventDefault(); show('usuario'); });
 ba.addEventListener('click', function(e){ e.preventDefault(); show('admin'); });
 bm.addEventListener('click', function(e){ e.preventDefault(); show('almacen'); });
 // also delegate on document for safety
 document.addEventListener('click', function(e){
   var t=e.target; if(!t) return;
   var txt=t.textContent||'';
   if(txt.includes('Usuario')){ show('usuario'); }
   if(txt.includes('Admin CC')){ show('admin'); }
   if(txt.includes('Almacén')){ show('almacen'); }
 });
 show('usuario');
}
window.addEventListener('load', function(){ setTimeout(attach, 500); });
setTimeout(attach, 1000);
})();
</script>

function encontrarSvgDemo(){
  var svgs=document.querySelectorAll('svg'); var mejor=null, maxArea=0;
  svgs.forEach(function(svg){ var r=svg.getBoundingClientRect(); var a=r.width*r.height; if(r.width>200 && r.height>200 && a>maxArea){ maxArea=a; mejor=svg; } });
  if(!mejor && svgs.length>0) mejor=svgs[svgs.length-1]; return mejor;
}

function encontrarContenedorMapa(){
  var svg=encontrarSvgDemo(); if(!svg) return null;
  var cont=svg.parentElement;

  while(cont && tries<5){
    var style=window.getComputedStyle(cont);
    if(style.perspective && style.perspective!=='none') return cont;
    if(cont.clientWidth>300 && cont.clientHeight>200) return cont;
    cont=cont.parentElement;
    tries++;
  }
  return svg.parentElement;
}

  var btnZoomIn=document.createElement('button'); btnZoomIn.textContent='+'; btnZoomIn.title='Acercar'; btnZoomIn.style.cssText='width:44px;height:44px;background:white;color:black;border:3px solid black;border-radius:12px;font-weight:900;font-size:20px;box-shadow:4px 4px 0px black;cursor:pointer;';

  var btnZoomReset=document.createElement('button'); btnZoomReset.textContent='⟲'; btnZoomReset.title='Reset zoom'; btnZoomReset.style.cssText='width:44px;height:30px;background:#FFE66D;color:black;border:3px solid black;border-radius:12px;font-weight:900;font-size:14px;box-shadow:4px 4px 0px black;cursor:pointer;';

function snapAPasillo(x,y){
  var pasillos=[20,50,80]; var closest=pasillos[0]; var minDist=Math.abs(y-pasillos[0]);
  for(var i=1;i<pasillos.length;i++){ var d=Math.abs(y-pasillos[i]); if(d<minDist){ minDist=d; closest=pasillos[i]; } }
  var newY=y; if(minDist>18) newY=closest; else newY=Math.max(12, Math.min(88, y));
  var newX=Math.max(8, Math.min(92, x));
  return {x:newX, y:newY};
}

function crearCirculoSVG(svg, x, y, color, id){
  try{
    var circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', '1.2');
    circle.setAttribute('fill', color); circle.setAttribute('stroke', 'white'); circle.setAttribute('stroke-width', '0.6');
    circle.setAttribute('data-demo', id);
    svg.appendChild(circle);
    return circle;
  }catch(e){ return null; }
}

function marcarAzul(clientX, clientY){
  var svg=encontrarSvgDemo(); if(!svg) return;
  var rect=svg.getBoundingClientRect();
  var xPct=((clientX-rect.left)/rect.width)*100;
  var yPct=((clientY-rect.top)/rect.height)*100;
  xPct=Math.max(5, Math.min(95, xPct)); yPct=Math.max(5, Math.min(95, yPct));
  var snapped=snapAPasillo(xPct,yPct);
  puntoAzulMap={x:snapped.x, y:snapped.y};
  console.log('Azul escogido', snapped);
  document.querySelectorAll('circle[data-demo="azul"]').forEach(c=>c.remove());
  crearCirculoSVG(svg, snapped.x, snapped.y, '#3B82F6', 'azul');
  document.getElementById('overlay-demo').style.display='none';
  document.getElementById('popup-origen').style.display='none';
  var ov=document.getElementById('overlay-fijo-demo'); if(ov) ov.style.display='none';
  var inst=document.getElementById('instruccion-mapa'); if(inst){ inst.textContent='🔵 Azul fijo • Toca almacén para rojo'; inst.style.background='#3B82F6'; inst.style.color='white'; }
  document.getElementById('btn-reset-demo').style.display='block';
  paso=2;
  setTimeout(function(){ mostrarPopup(2); }, 600);
}

function marcarRojo(clientX, clientY, tienda){
  console.log('Rojo pedido', tienda);
  puntoRojoTienda=tienda;
  var idMap={ 'zara':'zara', 'velez':'velez', 'hm':'hm', 'h&m':'hm', 'tostao':'tostao', 'starbucks':'starbucks', 'crepes':'crepes', 'juan valdez':'juan', 'juan':'juan', 'arturo':'arturo', 'crepes & waffles':'crepes' };
  var tiendaLower=tienda.toLowerCase().trim();
  puntoRojoId=idMap[tiendaLower] || tiendaLower;
  
  // Si tenemos azul y calcularRuta, colocar rojo EXACTO donde termina la ruta (centro real de la tienda) para que no se salte
  var posicionFinal=null;
  if(puntoAzulMap && window.calcularRuta){
    try{
      var rutaTemp=window.calcularRuta(puntoAzulMap, puntoRojoId);
      if(rutaTemp && rutaTemp.length>=1){
        var ultimo=rutaTemp[rutaTemp.length-1];
        posicionFinal={x:ultimo.x, y:ultimo.y};
        console.log('Posicion real tienda', tienda, 'desde ruta', posicionFinal, 'ultimo punto', ultimo);
      }
    }catch(e){ console.log('Error calc ruta temp', e); }
  }
  
  var svg=encontrarSvgDemo();
  if(svg){
    var xRojo, yRojo;
    if(posicionFinal){
      xRojo=posicionFinal.x; yRojo=posicionFinal.y;
    } else {
      var rect=svg.getBoundingClientRect();
      var xPct=((clientX-rect.left)/rect.width)*100;
      var yPct=((clientY-rect.top)/rect.height)*100;
      var snappedRojo=snapAPasillo(xPct,yPct);
      xRojo=snappedRojo.x; yRojo=snappedRojo.y;
    }
    puntoRojoMap={x:xRojo, y:yRojo};
    document.querySelectorAll('circle[data-demo="rojo"]').forEach(c=>c.remove());
    crearCirculoSVG(svg, xRojo, yRojo, '#FF4444', 'rojo');
    console.log('Rojo FINAL colocado en', puntoRojoMap, 'para tienda', tienda);
  }
  document.getElementById('overlay-demo').style.display='none';
  document.getElementById('popup-destino').style.display='none';
  var inst=document.getElementById('instruccion-mapa'); if(inst){ inst.textContent='🔵→🔴 '+tienda.toUpperCase()+' • Dale INICIAR RUTA'; inst.style.background='#22C55E'; inst.style.color='white'; }
  var btn=document.getElementById('btn-iniciar-ruta-demo');
  if(btn){ btn.innerHTML='🚀 INICIAR RUTA: AZUL → '+tienda.toUpperCase(); btn.style.display='block'; }
  paso=3;
}

function iniciarRutaReal(){
  console.log('=== INICIAR RUTA ===', puntoAzulMap, '->', puntoRojoId);
  if(!puntoAzulMap || !puntoRojoId){ alert('Marca azul y rojo'); return; }
  
  if(window.calcularRuta && window.moverPuntoAzulPorRuta){
    try{
      var ruta=window.calcularRuta(puntoAzulMap, puntoRojoId);
      console.log('Ruta desde azul', puntoAzulMap, 'hasta', puntoRojoId, 'length', ruta.length);
      if(ruta && ruta.length>=2){
        window.moverPuntoAzulPorRuta(ruta);
        console.log('Ruta seteada desde azul escogido');
        
        // Intentar setear nombre tienda para no decir undefined
        if(window.iniciarRecorridoHacia){
          setTimeout(function(){
            try{
              window.iniciarRecorridoHacia(puntoRojoId);
              setTimeout(function(){
                var ruta2=window.calcularRuta(puntoAzulMap, puntoRojoId);
                window.moverPuntoAzulPorRuta(ruta2);
                console.log('Re-set ruta desde azul escogido');
              }, 200);
            }catch(e){}
          }, 100);
        }
        
        var inst=document.getElementById('instruccion-mapa');
        if(inst){ inst.textContent='🚀 Ruta: Azul → '+puntoRojoTienda.toUpperCase(); inst.style.background='#0A2342'; inst.style.color='white'; }
        setTimeout(function(){ var b=document.getElementById('btn-iniciar-ruta-demo'); if(b) b.style.display='none'; }, 1500);
        return;
      }
    }catch(e){ console.log('Error ruta', e); }
  }
  
  if(window.iniciarRecorridoHacia){
    try{ window.iniciarRecorridoHacia(puntoRojoId); }catch(e){}
  }
}

function convertirRojoEnAzul(){
  console.log('=== LLEGASTE AL ROJO - SOLO CAMBIO DE COLOR ROJO->AZUL, SIN TOCAR RUTA ===', puntoRojoMap);
  if(!puntoRojoMap) return;
  if(window._yaConvertido) return;
  window._yaConvertido=true;
  
  var svg=encontrarSvgDemo(); if(!svg){ window._yaConvertido=false; return; }
  
  // SOLO CAMBIO DE COLOR: el punto donde llegaste (rojo) ahora es azul, ese será próximo inicio
  var xAzul=puntoRojoMap.x;
  var yAzul=puntoRojoMap.y;
  
  document.querySelectorAll('circle[data-demo="rojo"]').forEach(c=>c.remove());
  document.querySelectorAll('circle[data-demo="azul"]').forEach(c=>c.remove());
  crearCirculoSVG(svg, xAzul, yAzul, '#3B82F6', 'azul');
  
  puntoAzulMap={x:xAzul, y:yAzul};
  puntoRojoMap=null; puntoRojoId=null; puntoRojoTienda=null;
  
  var inst=document.getElementById('instruccion-mapa');
  if(inst){ inst.textContent='✅ Llegaste a destino • Ahora eres AZUL aquí • Toca siguiente almacén para ROJO'; inst.style.background='#22C55E'; inst.style.color='white'; inst.style.fontWeight='900'; }
  
  paso=2;
  
  if(window._timeoutConversion){ clearTimeout(window._timeoutConversion); window._timeoutConversion=null; }
  
  setTimeout(function(){ mostrarPopup(2); window._yaConvertido=false; }, 800);
}

function crearOverlayFijo(){
  var svg=encontrarSvgDemo(); if(!svg){ setTimeout(crearOverlayFijo, 500); return; }
  var ex=document.getElementById('overlay-fijo-demo'); if(ex) ex.remove();
  var rect=svg.getBoundingClientRect();
  if(rect.width<100 || rect.height<100){ setTimeout(crearOverlayFijo, 500); return; }
  var div=document.createElement('div'); div.id='overlay-fijo-demo'; div.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;height:'+rect.height+'px;background:rgba(0,0,0,0);border:none;z-index:99998;cursor:crosshair;display:block;'; document.body.appendChild(div);
  function upd(){ var s=encontrarSvgDemo(); if(!s) return; var r=s.getBoundingClientRect(); div.style.left=r.left+'px'; div.style.top=r.top+'px'; div.style.width=r.width+'px'; div.style.height=r.height+'px'; }
  window.addEventListener('scroll', upd); window.addEventListener('resize', upd);
  div.addEventListener('click', function(e){
    if(paso!==1) return;
    marcarAzul(e.clientX, e.clientY);
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); return false;
  });
  ['mousedown','mouseup','mousemove','touchstart','touchend'].forEach(function(evt){
    div.addEventListener(evt, function(e){ if(paso!==1) return; e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); return false; }, true);
  });
}

function instalarObserver(){
  if(observerInstalado) return;
  var fb=document.getElementById('feedback-recorrido'); if(!fb){ setTimeout(instalarObserver, 500); return; }
  observerInstalado=true;
  
  // Observer para detectar cuando entras al demo (popup origen)
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting && entry.intersectionRatio>0.02){
        if(!demoVisible){
          demoVisible=true;
          if(paso===1) crearOverlayFijo();
          setTimeout(function(){ if(paso===1) mostrarPopup(1); }, 500);
        }
      } else if(entry.intersectionRatio<0.01){
        demoVisible=false;
        var ov=document.getElementById('overlay-fijo-demo'); if(ov) ov.style.display='none';
      }
    });
  },{threshold:[0,0.01,0.02,0.05,0.1]});
  obs.observe(fb);
  
  // Observer para detectar llegada al rojo (cadena)
  if(observerRuta) observerRuta.disconnect();
  observerRuta=new MutationObserver(function(mutations){
    mutations.forEach(function(m){
      var texto=(m.target.textContent||'').toLowerCase();
      if(texto.includes('listo en') && paso===3){
        console.log('Detectado Listo en, convirtiendo rojo en azul', texto);
        setTimeout(function(){ convertirRojoEnAzul(); }, 1500);
      }
    });
  });
  observerRuta.observe(fb, {childList:true, subtree:true, characterData:true});
  
  // También observar cambios en texto con intervalo como respaldo
  setInterval(function(){
    var fb2=document.getElementById('feedback-recorrido');
    if(!fb2) return;
    var t=(fb2.textContent||'').toLowerCase();
    if(t.includes('listo en') && paso===3 && puntoRojoMap){
      // Solo convertir una vez
      if(!window._yaConvertido){
        window._yaConvertido=true;
        console.log('Interval detectó Listo en, convirtiendo');
        convertirRojoEnAzul();
        setTimeout(function(){ window._yaConvertido=false; }, 3000);
      }
    }
  }, 1000);
}

function instalar(){
  crearUI();
  document.addEventListener('click', function(e){
    if(paso!==2) return;
    if(e.target.closest('button')) return;
    if(e.target.closest('#overlay-fijo-demo')) return;
    if(e.target.closest('#zoom-controls')) return;
    if(e.target.closest('input') || e.target.tagName==='INPUT') return;
    var texto=(e.target.textContent||'')+' '+((e.target.parentElement&&e.target.parentElement.textContent)||'');
    if(texto.includes('Buscá tu almacén') || texto.includes('Vélez, Zara, Starbucks')) return;
    var esAlmacen=texto.match(/ZARA|H&M|VÉLEZ|VELEZ|TOSTAO|CREPES|STUDIO|TENNIS|ARTURO|JUAN VALDEZ|STARBUCKS/i);
    if(!esAlmacen) return;
    var tienda='tienda';
    if(texto.includes('ZARA')) tienda='zara';
    else if(texto.includes('VÉLEZ')||texto.includes('VELEZ')) tienda='velez';
    else if(texto.includes('H&M')) tienda='hm';
    else if(texto.includes('TOSTAO')) tienda='tostao';
    else if(texto.includes('STARBUCKS')) tienda='starbucks';
    else if(texto.includes('CREPES')) tienda='crepes';
    else if(texto.includes('JUAN VALDEZ')) tienda='juan valdez';
    else if(texto.includes('ARTURO')) tienda='arturo';
    marcarRojo(e.clientX, e.clientY, tienda);
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
  }, true);
}
setTimeout(instalar, 300);
setTimeout(instalarObserver, 600);
})();
</script>
